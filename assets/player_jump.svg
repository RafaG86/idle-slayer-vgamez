<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Cape (flowing downwards/backwards) -->
  <polygon points="25,20 10,24 6,44 14,48 24,30" fill="#dc2626"/>
  <polygon points="25,20 12,23 8,38 18,42 25,28" fill="#ef4444"/>
  <!-- Torso & Armor -->
  <rect x="23" y="18" width="14" height="18" rx="4" fill="#94a3b8"/>
  <rect x="25" y="20" width="10" height="14" rx="2" fill="#cbd5e1"/>
  <!-- Belt -->
  <rect x="22" y="32" width="16" height="4" rx="1" fill="#78350f"/>
  <rect x="27" y="33" width="5" height="4" rx="1" fill="#fbbf24"/>
  <!-- Legs (tucked up in jump) -->
  <rect x="18" y="32" width="8" height="14" rx="3" fill="#334155" transform="rotate(35 18 32)"/>
  <rect x="24" y="34" width="8" height="14" rx="3" fill="#475569" transform="rotate(40 24 34)"/>
  <rect x="24" y="44" width="10" height="6" rx="2" fill="#1e293b"/>
  <!-- Head & Helmet -->
  <circle cx="30" cy="11" r="10" fill="#64748b"/>
  <rect x="23" y="5" width="14" height="14" rx="5" fill="#94a3b8"/>
  <!-- Crest & Visor -->
  <polygon points="27,1 33,1 31,5 29,5" fill="#fbbf24"/>
  <rect x="29" y="10" width="9" height="3" rx="1" fill="#38bdf8"/>
  <!-- Arm & Sword thrust forward -->
  <rect x="30" y="20" width="12" height="6" rx="3" fill="#cbd5e1"/>
  <rect x="40" y="19" width="4" height="8" rx="1" fill="#fbbf24"/>
  <polygon points="44,21 62,19 64,22 44,24" fill="#e2e8f0"/>
  <polygon points="44,21 62,19 63,20 44,22" fill="#ffffff"/>
</svg>
