<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="dirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2817"/>
      <stop offset="100%" stop-color="#24170d"/>
    </linearGradient>
  </defs>
  <!-- Dirt background -->
  <rect x="0" y="0" width="128" height="128" fill="url(#dirtGrad)"/>
  
  <!-- Dirt details / stones -->
  <rect x="16" y="48" width="16" height="12" rx="4" fill="#523924"/>
  <rect x="80" y="36" width="20" height="14" rx="4" fill="#47311d"/>
  <rect x="44" y="80" width="14" height="10" rx="3" fill="#301f11"/>
  <rect x="100" y="88" width="18" height="12" rx="4" fill="#523924"/>
  <rect x="12" y="104" width="24" height="14" rx="4" fill="#47311d"/>
  
  <!-- Grass top layer -->
  <rect x="0" y="0" width="128" height="24" fill="#2d6e32"/>
  <rect x="0" y="0" width="128" height="10" fill="#4bb543"/>
  <!-- Grass blades hanging down -->
  <polygon points="0,24 8,34 16,24" fill="#2d6e32"/>
  <polygon points="24,24 32,36 40,24" fill="#2d6e32"/>
  <polygon points="48,24 56,33 64,24" fill="#2d6e32"/>
  <polygon points="72,24 80,38 88,24" fill="#2d6e32"/>
  <polygon points="96,24 104,32 112,24" fill="#2d6e32"/>
  <polygon points="116,24 122,35 128,24" fill="#2d6e32"/>
</svg>
